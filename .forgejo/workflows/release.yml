---
name: release

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: djpi-release-main
  cancel-in-progress: false

jobs:
  release:
    # Release validation and semantic-release both need the host Nix daemon.
    # The container pool cannot create the kernel namespaces required by Nix's
    # sandbox, while the `nix` runner keeps sandboxing enabled in the daemon.
    runs-on: nix
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: validate
        run: nix develop --command ./scripts/check.sh

      - name: semantic release
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_URL: https://git.kuhree.com
          FORGEJO_REPOSITORY: kuhree/djpi
        run: |
          set -euo pipefail
          git config user.name "forgejo-actions[bot]"
          git config user.email "forgejo-actions[bot]@noreply.git.kuhree.com"
          nixpkgs_rev="$(
            nix eval --impure --raw --expr \
              '(builtins.fromJSON (builtins.readFile ./flake.lock)).nodes.nixpkgs.locked.rev'
          )"
          nix shell "github:NixOS/nixpkgs/${nixpkgs_rev}#semantic-release" \
            --command semantic-release
